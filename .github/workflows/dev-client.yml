name: Dev Client

on:
    push:
        branches:
            - dev-client

permissions:
    contents: read

concurrency:
    group: dev-client-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run typecheck
              run: npm run typecheck

            - name: Run lint
              run: npm run lint

    build-dev-ios:
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev-client'
        runs-on: ubuntu-latest
        # needs: [quality] # TODO: require
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Setup Expo and EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: npm ci

            - name: Build iOS dev client on EAS
              run: npx eas-cli build --platform ios --profile development --non-interactive --no-wait
