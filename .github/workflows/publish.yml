name: Publish package to GitHub Packages
on:
    push:
        branches: ["latest/**"]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            id-token: write  # Required for OIDC
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0
            # Setup .npmrc file to publish to GitHub Packages
            - uses: actions/setup-node@v7
              with:
                  node-version: "24.x"
                  registry-url: 'https://registry.npmjs.org'
                  # Defaults to the user or organization that owns the workflow file
                  scope: "@reillymc"
            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Determine npm release-tag
              id: release-tag
              run: |
                line="${GITHUB_REF_NAME#latest/}"
                highest="$(git ls-remote --heads origin 'refs/heads/latest/*' \
                  | sed 's#.*refs/heads/latest/##' \
                  | sort -V \
                  | tail -n 1)"

                if [ "$line" = "$highest" ]; then
                  echo "tag=latest" >> "$GITHUB_OUTPUT"
                else
                  echo "tag=release-${line}" >> "$GITHUB_OUTPUT"
                fi

            - name: Bump patch version and push
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                npm version patch
                git push --follow-tags
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish package
              run: npm publish --provenance --access public --tag "${{ steps.release-tag.outputs.tag }}"


